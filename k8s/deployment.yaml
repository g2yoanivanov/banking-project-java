apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
    spec:
      containers:
        - name: banking-app
          image: g2yoan/banking-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 6262
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"